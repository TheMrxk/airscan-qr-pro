# AirScan-QR Pro 站点
# 与其他项目一致：容器内纯 HTTP:80，由 Cloudflare 在边缘终结 HTTPS。
# 不做自签证书——手机经域名访问看到的是 CF 可信证书；PWA 需要的 HTTPS 也由 CF 满足。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index receiver.html;

    # Service Worker 必须能控制全站作用域，且不能被缓存
    location = /sw.js {
        add_header Cache-Control "no-store";
        add_header Service-Worker-Allowed "/";
    }
    location = /manifest.webmanifest {
        add_header Content-Type "application/manifest+json";
        add_header Cache-Control "no-store";
    }
    # 离线单文件发送端：点击直接下载（不打开）
    location = /airscan-sender-standalone.html {
        add_header Content-Disposition 'attachment; filename="airscan-sender-standalone.html"';
    }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
