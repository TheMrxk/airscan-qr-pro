<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AirScan-QR Pro · 发送</title>
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AirScan发送">
<style>
  :root { --bg:#0f172a; --card:#1e293b; --accent:#3b82f6; --ok:#22c55e; --mut:#94a3b8; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:#e2e8f0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  .wrap { max-width:760px; margin:0 auto; padding:16px; }
  h1 { font-size:18px; margin:8px 0 4px; }
  .sub { color:var(--mut); font-size:12px; margin-bottom:14px; }
  .card { background:var(--card); border-radius:14px; padding:16px; margin-bottom:14px; }
  label.row { display:block; font-size:13px; color:var(--mut); margin:10px 0 4px; }
  input[type=file], select, input[type=range] { width:100%; }
  select, button { font-size:14px; border-radius:10px; border:1px solid #334155; background:#0f172a; color:#e2e8f0; padding:10px 12px; }
  button.primary { background:var(--accent); border-color:var(--accent); font-weight:700; cursor:pointer; width:100%; }
  button.ghost { background:transparent; cursor:pointer; }
  .line { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .stat { font-size:13px; color:var(--mut); line-height:1.9; }
  .stat b { color:#fbbf24; font-variant-numeric:tabular-nums; }
  #stage { display:none; text-align:center; }
  #player { background:#fff; border-radius:12px; max-width:100%; }
  .meta-overlay { font-size:12px; color:var(--mut); margin-top:8px; font-variant-numeric:tabular-nums; }
  .pill { display:inline-block; background:#0f172a; border:1px solid #334155; border-radius:999px; padding:2px 10px; font-size:12px; margin-right:6px; }
  .err { color:#f87171; font-size:13px; min-height:18px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📤 AirScan-QR Pro · 发送端</h1>
  <div class="sub">物理隔离单向传输 · 纯本地运行 · gzip压缩 · M1单码 · <span data-app-version>v0.4.2</span></div>

  <div class="card" id="setup">
    <label class="row">① 选择文件（或粘贴文本）</label>
    <input type="file" id="file">
    <label class="row">或直接输入文本（与文件二选一）</label>
    <textarea id="text" rows="3" style="width:100%;background:#0f172a;color:#e2e8f0;border:1px solid #334155;border-radius:10px;padding:10px" placeholder="粘贴要传输的文字…"></textarea>

    <label class="row">② 扫描密度（越低越好扫；先从 V15 试）</label>
    <select id="density">
      <option value="10">V10 · 约 241B/帧（最稳，慢）</option>
      <option value="15" selected>V15 · 约 483B/帧（推荐起步）</option>
      <option value="20">V20 · 约 809B/帧</option>
      <option value="25">V25 · 约 1213B/帧（要求屏幕清晰）</option>
    </select>

    <label class="row">②.5 同屏码数（矩阵，手机正对屏幕；越高速越要稳）</label>
    <select id="matrix">
      <option value="1" selected>1×1 单码（最稳，任意角度）</option>
      <option value="2">2×2 四码（约 3~4 倍速度，需正对）</option>
      <option value="3">3×3 九码（最快，需正对+大屏清晰）</option>
    </select>
    <div class="row" id="matrixHint" style="font-size:12px;color:#fbbf24;margin-top:4px"></div>

    <label class="row">③ 播放帧率（帧/秒，手机识别跟得上再调高）<span id="fpsv">8</span> fps</label>
    <input type="range" id="fps" min="2" max="20" value="8">

    <div class="err" id="err"></div>
    <div style="height:10px"></div>
    <button class="primary" id="start">🚀 开始播放二维码</button>
  </div>

  <div class="card" id="stage">
    <canvas id="player" width="480" height="480"></canvas>
    <div class="meta-overlay">
      <span class="pill" id="mType">META</span>
      <span id="mSeq">0/0</span> · <span id="mTask"></span>
    </div>
    <div class="stat" id="stats" style="text-align:left;margin-top:10px"></div>
    <div style="height:10px"></div>
    <button class="ghost" id="stop">■ 停止</button>
  </div>
</div>

<!-- 本地化库（无外链） -->
<script>
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/

//  http://www.opensource.org/licenses/mit-license.php

// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html

//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {

// lt-code.js — Luby Transform 喷泉码（M2/P1）
// 纯 ES Module，无依赖，浏览器与 Node(node:test) 通用。
//
// 设计要点：
// - 文件补齐切成 K 个等长 source block（最后一块零补齐，真实长度由 meta.fileLen 截断）。
// - 每个编码包只带 seed（=帧 frameSeq）。发送端/接收端用同一确定性 PRNG 由 seed
//   重现「度 + 邻居 block 列表」，所以无需在包里传邻居，省大量载荷。
// - 鲁棒孤波分布（Robust Soliton）抽度；接收端置信传播（BP）解码。
// - 收任意 K·(1+ε) 个不同包即可解出，无需 ACK、无需知道缺哪帧、天然抗丢帧/乱序/重复。
//
// 参数 c / delta 为可调项（§9 开放问题，真机数据后再标定），默认经典值 c=0.1, delta=0.001。

// ---------- 确定性 PRNG（mulberry32）：同 seed 两端序列完全一致 ----------
function mulberry32(seed) {
  let a = seed >>> 0;
  return function next() {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------- 鲁棒孤波度分布 ----------
// 返回按给定 rng 抽一个度 d（1..K）的函数所需的 CDF。
function buildRobustSoliton(K, c, delta) {
  const S = c * Math.log(K / delta) * Math.sqrt(K); // 期望度峰值的辅助量
  const pivot = Math.max(1, Math.round(K / S));     // 尖峰位置（K/S 附近）
  const pdf = new Float64Array(K + 1);              // 1..K
  for (let d = 1; d <= K; d++) {
    // rho：理想孤波
    let rho = d === 1 ? 1 / K : 1 / (d * (d - 1));
    // tau：鲁棒修正
    let tau = 0;
    if (d < pivot) tau = S / (d * K);
    else if (d === pivot) tau = (S / K) * Math.log(S / delta);
    pdf[d] = rho + tau;
  }
  let sum = 0;
  for (let d = 1; d <= K; d++) sum += pdf[d];
  // 归一化为 CDF
  const cdf = new Float64Array(K + 1);
  let acc = 0;
  for (let d = 1; d <= K; d++) { acc += pdf[d] / sum; cdf[d] = acc; }
  cdf[K] = 1; // 消除浮点误差，保证能抽到 K
  return cdf;
}

function sampleDegree(rng, cdf, K) {
  const u = rng();
  for (let d = 1; d <= K; d++) if (u < cdf[d]) return d;
  return K;
}

// 无放回抽 degree 个不同邻居（Fisher–Yates 部分洗牌，确定性依赖 rng）
function sampleNeighbors(rng, K, degree) {
  const idx = Array.from({ length: K }, (_, i) => i);
  for (let i = 0; i < degree; i++) {
    const j = i + Math.floor(rng() * (K - i));
    [idx[i], idx[j]] = [idx[j], idx[i]];
  }
  return idx.slice(0, degree);
}

// 由 seed 重现该编码包的 {degree, neighbors}。两端必须用完全相同的 K/c/delta。
function describePacket(seed, K, c = 0.2, delta = 0.001) {
  const rng = mulberry32(seed);
  const cdf = buildRobustSoliton(K, c, delta);
  const degree = sampleDegree(rng, cdf, K);
  const neighbors = sampleNeighbors(rng, K, degree);

// ---------- 编码：生成第 seed 个 LT 包的 XOR payload ----------
function encodePacket(blocks, seed, c = 0.2, delta = 0.001) {
  const K = blocks.length;
  const blockSize = blocks[0].length;
  const { neighbors } = describePacket(seed, K, c, delta);
  const out = new Uint8Array(blockSize);
  for (const n of neighbors) {
    const b = blocks[n];
    for (let i = 0; i < blockSize; i++) out[i] ^= b[i];
  }
  return out;
}

// ---------- 解码：置信传播（BP） ----------
// 用法：const dec = new LTDecoder(K, blockSize);
//       每收到一个包 dec.addPacket(seed, payload)；dec.blocks 解出后非 null。
class LTDecoder {
  constructor(K, blockSize, c = 0.2, delta = 0.001) {
    this.K = K;
    this.blockSize = blockSize;
    this.c = c; this.delta = delta;
    this.blocks = new Array(K).fill(null);   // 解出的源块
    this.decodedCount = 0;

    // 未决（尚未消成单邻居）的包：neighbors 为「仍未知」的源块索引，payload 为剩余 XOR
    this.pending = [];

  get progress() { return this.decodedCount / this.K; }

    if (!payloadIn || payloadIn.length !== this.blockSize) return; // 长度不符，丢弃
    this.seen.add(seed);

    // 拷贝一份，避免修改接收缓冲；先 XOR 掉所有「已知」源块
    const payload = new Uint8Array(this.blockSize);
    payload.set(payloadIn);
    const { neighbors } = describePacket(seed, this.K, this.c, this.delta);
    const unknown = [];
    for (const n of neighbors) {
      if (this.blocks[n]) {

  _recover(index, value) {
    if (this.blocks[index]) return;
    this.blocks[index] = value;
    this.decodedCount++;
    // 遍历未决列表，原地消元；产生新的度1包则递归
    const newly = [];
    const keep = [];
    for (const p of this.pending) {
      const pos = p.unknown.indexOf(index);
      if (pos >= 0) {
        for (let i = 0; i < this.blockSize; i++) p.payload[i] ^= value[i];
        p.unknown.splice(pos, 1);
        if (p.unknown.length === 1) newly.push(p);
        else if (p.unknown.length > 1) keep.push(p);
        // unknown.length===0：纯冗余，丢弃
      } else {
        keep.push(p);
      }
    }
    this.pending = keep;
    for (const p of newly) {
      if (this.done) break;
      this._recover(p.unknown[0], p.payload);
    }
  }
}

// 把字节数据切成 K 个等长块（最后一块零补齐），返回 {blocks, K, blockSize, rawLen}
function splitEqual(data, blockSize) {
  const raw = data instanceof Uint8Array ? data : new Uint8Array(data);
  const K = Math.max(1, Math.ceil(raw.length / blockSize));
  const blocks = new Array(K);
  for (let i = 0; i < K; i++) {
    const blk = new Uint8Array(blockSize);
    const start = i * blockSize;
    blk.set(raw.subarray(start, Math.min(start + blockSize, raw.length)));
    blocks[i] = blk;
  }
  return { blocks, K, blockSize, rawLen: raw.length };
}

/* ===== matrix.js ===== */
// matrix.js — 多码矩阵布局（M3/P2）
// 一屏渲染 N×N 个 QR，每个承载同一 LT 任务的不同 seed 包，单屏吞吐 ×N²。
//
// 约定：
// - 矩阵所有格【同步】：某一 tick 要么全格播同一个 META（帮晚到接收端锁定），
//   要么各格播连续的 N² 个 DATA(seed) 包；绝不混播（接收端按格切分时类型一致）。
// - 格间留白边（每格自带 quiet zone），既是 QR 规范也方便接收端按等分切格。
// - 手机正对屏幕拍摄为 M3 基本假设；倾斜/透视畸变的校正留待后续（见开发文档 §3 阶段三）。

// 在 canvas ctx 上画 N×N 矩阵。
// qrs: 长度 N*N 的 qrcode 实例数组（已 addData+make），行优先。
// canvasSize: 画布像素边长（正方形）。
function paintMatrix(ctx, canvasSize, n, qrs) {
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, canvasSize, canvasSize);
  const cellPx = canvasSize / n;          // 每格在画布上的像素边长
  const margin = 4;                         // 每格 quiet zone（模块数）
  ctx.fillStyle = "#000";
  for (let i = 0; i < n; i++) {
    for (let j = 0; j < n; j++) {
      const qr = qrs[i * n + j];
      if (!qr) continue;
      const modules = qr.getModuleCount();
      const modulePx = Math.floor(cellPx / (modules + margin * 2));
      const ox = j * cellPx;
      const oy = i * cellPx;
      for (let r = 0; r < modules; r++) {
        for (let c = 0; c < modules; c++) {
          if (qr.isDark(r, c)) {
            ctx.fillRect(
              ox + (c + margin) * modulePx,
              oy + (r + margin) * modulePx,
              modulePx, modulePx
            );
          }
        }
      }
    }
  }
}

// 高性能版本（浏览器）：每个 QR 先画到一张离屏小 canvas（逐模块），再用 drawImage
// 缩放到目标格。GPU 加速的 drawImage 比在主画布上做 N²×模块² 次 fillRect 快一个量级，
// 3×3 高帧率时尤其明显。node 环境无 document，用 paintMatrix。
function paintMatrixFast(ctx, canvasSize, n, qrs, doc = (typeof document !== "undefined" ? document : null)) {
  if (!doc) return paintMatrix(ctx, canvasSize, n, qrs);
  const cellPx = canvasSize / n;
  const margin = 4;
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, canvasSize, canvasSize);
  ctx.imageSmoothingEnabled = false;
  for (let i = 0; i < n; i++) {
    for (let j = 0; j < n; j++) {
      const qr = qrs[i * n + j];
      if (!qr) continue;
      const modules = qr.getModuleCount();
      const inner = modules + margin * 2;
      // 离屏按模块 1:1 画（inner×inner 像素），再缩放到格内
      const off = doc.createElement("canvas");
      off.width = inner; off.height = inner;
      const octx = off.getContext("2d");
      octx.fillStyle = "#fff"; octx.fillRect(0, 0, inner, inner);
      octx.fillStyle = "#000";
      for (let r = 0; r < modules; r++)
        for (let c = 0; c < modules; c++)
          if (qr.isDark(r, c)) octx.fillRect(c + margin, r + margin, 1, 1);
      const target = Math.floor(cellPx);
      ctx.drawImage(off, 0, 0, inner, inner, j * cellPx, i * cellPx, target, target);
    }
  }
}

// 接收端：给定矩阵阶数 n 与中心方形 ROI 边长（摄像头像素），
// 返回 n*n 个 {sx, sy, size} 源裁剪矩形（行优先），供 drawImage 逐格裁出解码。
// 中心点 (cx, cy)。默认不内缩（insetRatio=0）：接收端按完整等分格裁剪，
// 靠每格自身 quiet zone 与邻格隔离；真机若有透视/手抖，可由调用方传入小比例微调
// （注意内缩只缩小采样框、不能切掉格内 QR，故应配合重采样而非简单平移）。
function matrixCells(cx, cy, side, n, insetRatio = 0) {
  const cell = side / n;
  const inset = cell * insetRatio;
  const cells = [];
  for (let i = 0; i < n; i++) {
    for (let j = 0; j < n; j++) {
      cells.push({
        sx: Math.round(cx - side / 2 + j * cell + inset),
        sy: Math.round(cy - side / 2 + i * cell + inset),
        size: Math.round(cell - inset * 2),
      });
    }
  }
  return cells;
}

/* ===== packet.js ===== */
// packet.js — 文件 ↔ 喷泉码帧序列 的高层打包/解包（M2：LT）
// 串起 compressor + protocol + lt-code，对 sender/receiver/UI 暴露简单接口。
//
// M2 架构：
//   发送：文件→(压缩)→补齐切 K 个等长 source block→每个播放时刻按 seed 现算 LT 编码包→帧
//        seed 单调递增（就是帧的 frameSeq），无限产生，屏幕循环播放；META 周期插播。
//   接收：META 锁定→建 LTReceiver→每收到一个不同 seed 的包就喂入→BP 解码→
//        收任意 ~1.4K 个有效包即解出→截断到 compressedLen→解压→SHA256 校验。
// 无需 ACK、无需知道缺哪帧，天然抗丢帧/乱序/重复。




async function sha256(bytes) {
  if (globalThis.crypto?.subtle) {
    const digest = await crypto.subtle.digest("SHA-256", bytes);
    return new Uint8Array(digest);
  }
  // Node 单测兜底
  const { createHash } = await import("node:crypto");
  return new Uint8Array(createHash("sha256").update(bytes).digest());
}

// 把文件打包成 LT 发送上下文。
// 入参：{name, data(Uint8Array), taskId?, blockSize, forceRaw?}
// 返回：{meta, metaFrame, blocks(等长补齐), K, blockSize}
// 不预生成所有帧——LT 包用 makeLtFrame(seed) 现算（无限流）。
async function packFile({
  name, data, taskId = null,
  blockSize, forceRaw = false, matrixN = 1,
}) {
  if (!blockSize || blockSize < 1) throw new Error("LT 必须显式给 blockSize（按 QR 密度反推）");
  const raw = data instanceof Uint8Array ? data : new Uint8Array(data);
  const { flags: compFlags, data: payloadData } = await compress(raw, { forceRaw });
  const flags = (compFlags & 0x0f) | encodeMatrixFlag(matrixN); // 低4位压缩 + 高4位矩阵阶数

  const { blocks, K } = splitEqual(payloadData, blockSize);
  const tId = taskId == null ? Math.floor(Math.random() * 0xffff) : taskId & 0xffff;
  const digest = await sha256(raw);

  const meta = {
    taskId: tId, flags, K, blockSize,
    fileLen: raw.length, compressedLen: payloadData.length, sha256: digest,
    name: name || "file.bin",
  };
  const metaFrame = buildMetaFrame(meta);
  return { meta, metaFrame, blocks, K, blockSize };
}

// 现算第 seed 个 LT 编码包的数据帧（发送端每个播放时刻调用）
function makeLtFrame(packed, seed) {
  const payload = encodePacket(packed.blocks, seed);
  return buildDataFrame({
    flags: packed.meta.flags, taskId: packed.meta.taskId, frameSeq: seed, payload,
  });
}

// 接收端：喂 metaFrame → 返回 meta（null=还不是有效 meta）
function unpackMeta(frame) {
  return parseMetaFrame(frame);
}

// 解一个数据帧 → {frameSeq(=seed),payload,crcOk}；CRC 坏/类型错返回 null
function unpackData(frame) {
  const d = parseDataFrame(frame);
  if (!d || !d.crcOk) return null;
  return { taskId: d.taskId, frameSeq: d.frameSeq, payload: d.payload, ver: d.ver };
}

// 接收端 LT 收集器：锁定 meta 后建一个，逐包喂入，done 后取文件。
class LTReceiver {
  constructor(meta) {
    this.meta = meta;
    this.dec = new LTDecoder(meta.K, meta.blockSize);
  }
  get progress() { return this.dec.progress; }
  get decodedBlocks() { return this.dec.decodedCount; }
  get done() { return this.dec.done; }
  seenPacket(seed) { return this.dec.seen.has(seed); }
  // 喂入一个 CRC 正确、taskId 匹配的数据包
  feed(seed, payload, taskId) {
    if (taskId !== this.meta.taskId) return;
    this.dec.addPacket(seed, payload);
  }
  // 解出全部块 → 截断到 compressedLen → 解压 → 长度+SHA256 校验 → 原始文件
  async assemble() {
    if (!this.dec.done) throw new Error(`LT 未解完：${this.dec.decodedCount}/${this.meta.K}`);
    const { K, blockSize, compressedLen } = this.meta;
    const compressed = new Uint8Array(compressedLen);
    for (let i = 0; i < K; i++) {
      const blk = this.dec.blocks[i];
      compressed.set(blk.subarray(0, Math.min(blockSize, compressedLen - i * blockSize)), i * blockSize);
    }
    const raw = await decompress(compressed, this.meta.flags);
    if (raw.length !== this.meta.fileLen) {
      throw new Error(`解压后长度不符：${raw.length}/${this.meta.fileLen}`);
    }
    const digest = await sha256(raw);
    if (!bytesEqual(digest, this.meta.sha256)) throw new Error("SHA-256 校验失败，文件损坏");
    return raw;
  }
}

function bytesEqual(a, b) {
  if (a.length !== b.length) return false;
  for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
  return true;
}

/* ===== wire-codec.js ===== */
// wire-codec.js — QR 物理层适配：把协议二进制帧 ↔ jsQR 能无损承载的文本
//
// 关键背景：jsQR 按 UTF-8/文本返回，裸二进制帧(含 0x00/非UTF8)会丢。必须编码成可打印文本。
//
// 当前默认（v0.4.0+）：**Base45(RFC9285) + QR Alphanumeric 模式**
//   Base45 字符集恰好是 QR Alphanumeric 字符集（每 QR 字符 5.5bit，Byte 模式 8bit），
//   实测比“Base64 + Byte 模式”省约 23% 容量（tests/base45 光学探针）。
//   wire 形态 = Base45(frameBytes) 本身，【无额外定界符】——Alphanumeric 集只有 45 个字符、
//   全被 Base45 用满，没有“空闲字符”当分隔符。jsQR 一次只返回一个 QR 的内容，接收端直接
//   对扫到的串做 Base45 解码，靠帧内 MAGIC("ASQP"→Base45 "SB8QCA") + 帧形状校验锁定。
//
// 向后兼容：仍识别旧 Base64+Byte 形态 "ASQP3.<b64>.E"（v0.2/0.3），按特征分流。
// v1/v2 更早的版本不再识别。



// Base45(MAGIC "ASQP") 的固定前缀，用于快速锚定本协议帧
const B45_MAGIC_PREFIX = "SB8QCA";

function hasMagic(bytes) {
  return bytes.length >= 4 &&
    bytes[0] === MAGIC[0] && bytes[1] === MAGIC[1] &&
    bytes[2] === MAGIC[2] && bytes[3] === MAGIC[3];
}

// 二进制帧 → 送进 QR 的纯 Base45 文本（QR 端用 Alphanumeric 模式渲染）
function encodeWire(frameBytes) {
  return encodeBase45(frameBytes);
}

// 告诉发送端：encodeWire 产出的文本要用哪种 QR 模式
const WIRE_QR_MODE = "Alphanumeric";

// 扫码文本 → 二进制帧；无法识别返回 null。先试 Base45（当前），再试旧 Base64。
function decodeWire(text) {
  if (!text || typeof text !== "string") return null;
  return tryBase45(text) || tryBase64(text);
}

function tryBase45(text) {
  const anchor = text.indexOf(B45_MAGIC_PREFIX);
  if (anchor < 0) return null;
  const okCh = (ch) => /[0-9A-Z $%*+\-./:]/.test(ch);
  // 向右扩展连续 Base45 字符
  let end = anchor + B45_MAGIC_PREFIX.length;
  while (end < text.length && okCh(text[end])) end++;
  // 向左收集合法字符（可能有画面噪声粘连；真实无噪声时 start=0 即帧首）
  let start = anchor;
  while (start > 0 && okCh(text[start - 1])) start--;

  // 合法 Base45 长度：3 的倍数（偶数字节）或余 2（末尾单字节组）；余 1 非法。
  // 在窗口内尝试不同左偏移（偶数个字符，保证魔数仍落在字节边界）与右截断，
  // 取首个解出合法帧的结果（容忍前后噪声粘连）。
  for (let ls = anchor; ls >= start; ls--) {
    if ((anchor - ls) % 2 !== 0) continue;
    for (let trim = 0; trim <= 10; trim++) {
      const len = end - ls - trim;
      if (len < B45_MAGIC_PREFIX.length || len % 3 === 1) continue;
      try {
        const bytes = decodeBase45(text.slice(ls, ls + len));
        if (hasMagic(bytes) && frameShapeOk(bytes)) return bytes;
      } catch { /* 下一候选 */ }
    }
  }
  return null;
}

// 粗校帧形状：至少够帧头，ver/type 合理
function frameShapeOk(bytes) {
  if (bytes.length < 6) return false;
  const ver = bytes[4], type = bytes[5];
  if (ver < 1 || ver > 10) return false;
  if (type !== 1 && type !== 2) return false;
  return true;
}

function tryBase64(text) {
  const m = text.match(/ASQP3\.([A-Za-z0-9+/]+={0,2})\./);
  if (!m) return null;
  try {
    const bin = atob(m[1]);
    const u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return hasMagic(u) ? u : null;
  } catch { return null; }
}

// 估算 Base45 wire 文本长度（选 QR 版本用）：每 2 字节 3 字符，尾单字节 2 字符
function wireTextLen(frameByteLen) {
  const pairs = Math.floor(frameByteLen / 2);
  const tail = frameByteLen % 2;
  return pairs * 3 + (tail ? 2 : 0);
}

/* ===== sender page ===== */





const $ = (id) => document.getElementById(id);
let timer = null, packed = null, seed = 1, frameCount = 0, matrixN = 1, qrVersion = 15;
const META_EVERY = 24;   // 每播放 N 个数据【tick】整屏插播一次 META（帮晚到的接收端锁定）

$("fps").addEventListener("input", e => $("fpsv").textContent = e.target.value);

// 矩阵×密度组合提示：格越多、密度越高，每格模块越小越难扫
function updateMatrixHint() {
  const n = parseInt($("matrix").value, 10);
  const v = parseInt($("density").value, 10);
  const el = $("matrixHint");
  if (n === 1) { el.textContent = ""; return; }
  if (n === 3 && v >= 20) el.textContent = "⚠ 3×3 + V" + v + " 每格很小，建议密度降到 V10/V15 并用大屏";
  else if (n === 2 && v >= 25) el.textContent = "⚠ 2×2 + V25 偏密，若难识别降到 V15/V20";
  else el.textContent = "提示：手机与屏幕尽量平行正对，距离让 4/9 个码都落在取景框内";
}
$("matrix").addEventListener("change", updateMatrixHint);
$("density").addEventListener("change", updateMatrixHint);

function err(msg){ $("err").textContent = msg || ""; }

$("start").addEventListener("click", async () => {
  err("");
  const f = $("file").files[0];
  const txt = $("text").value;
  let data, name;
  if (f) {
    data = new Uint8Array(await f.arrayBuffer());
    name = f.name;
  } else if (txt) {
    data = new TextEncoder().encode(txt);
    name = "note_" + Date.now().toString().slice(-5) + ".txt";
  } else { return err("请选择文件或输入文本"); }

  qrVersion = parseInt($("density").value, 10);
  matrixN = parseInt($("matrix").value, 10);
  // LT 等长块：用精确容量反推 blockSize（wire base64 膨胀已计入）
  const blockSize = wirePayloadCapacityB45(qrVersion);
  if (blockSize <= 0) return err("该密度容量异常，换低档位");
  try {
    packed = await packFile({ name, data, blockSize, taskId: Math.floor(Math.random()*0xffff), matrixN });
  } catch (e) { return err("打包失败：" + e.message); }

  // 越界硬校验：任意 LT 帧定长（payload=blockSize），抽一帧确认 wire 不超 QR 容量
  const probe = encodeWire(makeLtFrame(packed, 1));
  if (probe.length > alphaCapacity(qrVersion)) {
    return err(`编码越界：${probe.length} > V${qrVersion} 字母数字容量，请降密度`);
  }

  $("setup").style.display = "none";
  $("stage").style.display = "block";

  // canvas 内部分辨率自适应：矩阵时每格必须足够大手机才好解析。
  // 目标每格物理像素：矩阵 380px（对拍验证的可靠尺寸），单码取视口允许的较大值。
  const cv = $("player");
  const CELL_TARGET = 380;
  const vw = Math.max(320, window.innerWidth - 48);
  const vh = Math.max(320, window.innerHeight - 220);
  const viewMax = Math.min(vw, vh, 1400);          // 不超过视口，上限 1400
  const need = matrixN * CELL_TARGET;                // 矩阵需要的整图边长
  const size = Math.max(480, Math.min(need, viewMax));
  cv.width = size; cv.height = size;

  $("mTask").textContent = `${name} · ${(data.length/1024).toFixed(1)}KB · K=${packed.meta.K} · V${qrVersion} · ${matrixN}×${matrixN}矩阵 · LT喷泉`;
  seed = 1; frameCount = 0; sentPackets = 0;
  const fps = parseInt($("fps").value, 10);
  drawFrame();
  timer = setInterval(drawFrame, 1000 / fps);
  requestWakeLock();
});

// 屏幕常亮：播放期间阻止息屏（不支持就静默跳过，不影响功能）
let wakeLock = null;
async function requestWakeLock() {
  try {
    if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen");
  } catch { wakeLock = null; }
}
function releaseWakeLock() {
  if (wakeLock) { wakeLock.release().catch(()=>{}); wakeLock = null; }
}
// 从后台切回前台时自动重新申请（Wake Lock 在页面隐藏后会失效）
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && timer) requestWakeLock();
});

// 造一个已 addData+make 的 qrcode 实例
function makeQr(text) {
  const qr = qrcode(qrVersion, "L");
  qr.addData(text, WIRE_QR_MODE); // Base45 → QR Alphanumeric 模式（5.5bit/字符，省容量）
  qr.make();
  return qr;
}

function drawFrame() {
  const cv = $("player"), ctx = cv.getContext("2d");
  const n2 = matrixN * matrixN;
  // 整屏要么全 META、要么全 DATA（接收端按格切分时类型一致）
  const isMeta = frameCount % (META_EVERY + 1) === 0;

  if (isMeta) {
    const qrs = new Array(n2).fill(encodeWire(packed.metaFrame)).map(makeQr);
    paintMatrixFast(ctx, cv.width, matrixN, qrs);
    $("mType").textContent = "META";
    $("mSeq").textContent = "—";
  } else {
    const qrs = [];
    const firstSeed = seed;
    for (let k = 0; k < n2; k++) { qrs.push(makeQr(encodeWire(makeLtFrame(packed, seed)))); seed++; }
    paintMatrixFast(ctx, cv.width, matrixN, qrs);
    sentPackets += n2;
    $("mType").textContent = "DATA";
    $("mSeq").textContent = `LT#${firstSeed}~${seed - 1}`;
    updateStats();
  }
  frameCount++;
}

let sentPackets = 0;
function updateStats() {
  const need = `${Math.ceil(packed.meta.K*1.5)}~${Math.ceil(packed.meta.K*2)}`;
  $("stats").innerHTML = `文件 <b>${packed.meta.name}</b>　源块 K=<b>${packed.meta.K}</b><br>已播放 LT 包 <b>${sentPackets}</b>（${matrixN}×${matrixN} 矩阵，每屏 ${matrixN*matrixN} 包；收够约 ${need} 个自动完成）<br>压缩 <b>${packed.meta.flags & 1 ? "gzip" : "raw"}</b> · 漏扫无需重传`;
}

$("stop").addEventListener("click", () => {
  clearInterval(timer); timer = null;
  $("stage").style.display = "none";
  $("setup").style.display = "block";
  sentPackets = 0;
  releaseWakeLock();
});

</script>
</body>
</html>
