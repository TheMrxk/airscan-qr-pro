<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AirScan-QR Pro · 发送</title>
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AirScan发送">
<style>
  :root { --bg:#0f172a; --card:#1e293b; --accent:#3b82f6; --ok:#22c55e; --mut:#94a3b8; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:#e2e8f0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  .wrap { max-width:760px; margin:0 auto; padding:16px; }
  h1 { font-size:18px; margin:8px 0 4px; }
  .sub { color:var(--mut); font-size:12px; margin-bottom:14px; }
  .card { background:var(--card); border-radius:14px; padding:16px; margin-bottom:14px; }
  label.row { display:block; font-size:13px; color:var(--mut); margin:10px 0 4px; }
  input[type=file], select, input[type=range] { width:100%; }
  select, button { font-size:14px; border-radius:10px; border:1px solid #334155; background:#0f172a; color:#e2e8f0; padding:10px 12px; }
  button.primary { background:var(--accent); border-color:var(--accent); font-weight:700; cursor:pointer; width:100%; }
  button.ghost { background:transparent; cursor:pointer; }
  .line { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .stat { font-size:13px; color:var(--mut); line-height:1.9; }
  .stat b { color:#fbbf24; font-variant-numeric:tabular-nums; }
  #stage { display:none; text-align:center; }
  #player { background:#fff; border-radius:12px; max-width:100%; }
  .meta-overlay { font-size:12px; color:var(--mut); margin-top:8px; font-variant-numeric:tabular-nums; }
  .pill { display:inline-block; background:#0f172a; border:1px solid #334155; border-radius:999px; padding:2px 10px; font-size:12px; margin-right:6px; }
  .err { color:#f87171; font-size:13px; min-height:18px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📤 AirScan-QR Pro · 发送端</h1>
  <div class="sub">物理隔离单向传输 · 纯本地运行 · gzip压缩 · M1单码（v0.1）</div>

  <div class="card" id="setup">
    <label class="row">① 选择文件（或粘贴文本）</label>
    <input type="file" id="file">
    <label class="row">或直接输入文本（与文件二选一）</label>
    <textarea id="text" rows="3" style="width:100%;background:#0f172a;color:#e2e8f0;border:1px solid #334155;border-radius:10px;padding:10px" placeholder="粘贴要传输的文字…"></textarea>

    <label class="row">② 扫描密度（越低越好扫；先从 V15 试）</label>
    <select id="density">
      <option value="10">V10 · 约 200B/帧（最稳，慢）</option>
      <option value="15" selected>V15 · 约 350B/帧（推荐起步）</option>
      <option value="20">V20 · 约 600B/帧</option>
      <option value="25">V25 · 约 900B/帧（要求屏幕清晰）</option>
    </select>

    <label class="row">③ 播放帧率（帧/秒，手机识别跟得上再调高）<span id="fpsv">8</span> fps</label>
    <input type="range" id="fps" min="2" max="20" value="8">

    <div class="err" id="err"></div>
    <div style="height:10px"></div>
    <button class="primary" id="start">🚀 开始播放二维码</button>
  </div>

  <div class="card" id="stage">
    <canvas id="player" width="480" height="480"></canvas>
    <div class="meta-overlay">
      <span class="pill" id="mType">META</span>
      <span id="mSeq">0/0</span> · <span id="mTask"></span>
    </div>
    <div class="stat" id="stats" style="text-align:left;margin-top:10px"></div>
    <div style="height:10px"></div>
    <button class="ghost" id="stop">■ 停止</button>
  </div>
</div>

<!-- 本地化库（无外链） -->
<script>
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';

  const crcGiven = r.u32();
  const crcOk = crcGiven === crc32(payload);
  if (!crcOk) return { ver, flags, taskId, frameSeq, payload, crcOk: false };
  return { ver, flags, taskId, frameSeq, payload, crcOk: true };
}

// ---------- 分片（M1：定长，最后一块不补齐；接收端按 frameSeq 重组） ----------
function splitBlocks(data, blockSize) {
  const blocks = [];
  for (let i = 0; i < data.length; i += blockSize) {
    blocks.push(data.slice(i, i + blockSize));
  }
  return blocks;
}

// 生成 M1 全部数据帧（按顺序分片，无 LT）。
// flags 透传压缩标记；taskId 两字节随机。
function buildDataFrames(meta, compressedData, onBlockSize) {
  const bs = meta.blockSize;
  const frames = [];
  const blocks = splitBlocks(compressedData, bs);
  if (blocks.length !== meta.K) {
    throw new Error(`分片数 ${blocks.length} 与 meta.K=${meta.K} 不一致`);
  }
  blocks.forEach((payload, i) => {
    frames.push(buildDataFrame({
      flags: meta.flags, taskId: meta.taskId, frameSeq: i, payload,
    }));
  });
  return frames;
}

// ---------- QR 字节容量表（ISO/IEC 18004 Byte 模式权威值，含模式指示+字符计数开销） ----------
// version(1-40) → [L, M, Q, H] 可容纳原始字节数。多来源(qr.technology/useqr.app/ISO)核对一致。
// 注意：qrcode-generator 对超长数据不抛错（静默容错），故必须由本表在协议层自行限长。
const RAW_CAPACITY = {
  1: [17, 14, 11, 7], 2: [32, 26, 20, 14], 3: [53, 42, 32, 24],
  4: [78, 62, 46, 34], 5: [106, 84, 60, 44], 6: [134, 106, 74, 58],
  7: [154, 122, 86, 64], 8: [192, 152, 108, 84], 9: [230, 180, 130, 98],
  10: [271, 213, 151, 119], 11: [321, 251, 177, 137], 12: [367, 287, 203, 155],
  13: [425, 331, 241, 177], 14: [458, 362, 258, 194], 15: [520, 412, 292, 220],
  16: [586, 450, 322, 250], 17: [644, 504, 364, 280], 18: [718, 560, 394, 310],
  19: [792, 624, 442, 338], 20: [858, 666, 482, 382], 21: [929, 711, 509, 403],
  22: [1003, 779, 565, 439], 23: [1091, 857, 611, 461], 24: [1171, 911, 661, 511],
  25: [1273, 997, 715, 535], 26: [1367, 1059, 751, 593], 27: [1465, 1125, 805, 625],
  28: [1528, 1190, 868, 658], 29: [1628, 1264, 908, 698], 30: [1732, 1370, 982, 742],
  31: [1840, 1452, 1030, 790], 32: [1952, 1538, 1112, 842],
  33: [2068, 1628, 1168, 898], 34: [2188, 1722, 1228, 958],
  35: [2303, 1809, 1283, 983], 36: [2431, 1911, 1351, 1051],
  37: [2563, 1989, 1423, 1093], 38: [2699, 2099, 1499, 1139],
  39: [2809, 2213, 1579, 1219], 40: [2953, 2331, 1663, 1273],
};
const EC_INDEX = { L: 0, M: 1, Q: 2, H: 3 };

// QR 内可承载的【数据帧 payload】安全上限 = 字节容量 - 帧头 - CRC。
function qrPayloadCapacity(version, ecLevel = "L") {
  const row = RAW_CAPACITY[version];
  if (!row) throw new Error(`不支持的 QR 版本 ${version}`);
  const raw = row[EC_INDEX[ecLevel]];
  return Math.max(0, raw - DATA_HDR_LEN - DATA_CRC_LEN);
}

// M1 选档：给定 payload 需求字节，返回 {version, ec, capacity, blockSize}，
// 在不超容量前提下尽量选低版本（越好扫）；M1 用 L 级（距离换容量，靠 CRC/重扫兜底）。
function chooseQrProfile(needBytes) {
  for (let v = 10; v <= 40; v++) {
    const cap = qrPayloadCapacity(v, "L");
    if (cap >= needBytes) return { version: v, ec: "L", capacity: RAW_CAPACITY[v][0], blockSize: cap };
  }
  // 超过 V40 单码上限：调用方应缩小 blockSize 到 V40 上限分更多块
  const v = 40;
  return { version: v, ec: "L", capacity: RAW_CAPACITY[v][0], blockSize: qrPayloadCapacity(v, "L") };
}

/* ===== compressor.js ===== */
// compressor.js — 传输前压缩自适应（M1）
// 浏览器原生 CompressionStream/DecompressionStream（Chrome80+/Safari16.4+），
// 不引任何第三方库；不支持时自动降级 raw。
//
// 策略：gzip 后只有“实打实变小”才用 gzip（随机/已压缩数据 gzip 反而变大），
// 否则原样 raw。返回 {flags, data}，flags 与 protocol.FLAG_* 对应。
function supportsCompressionStream() {
  return typeof globalThis.CompressionStream === "function" &&
    typeof globalThis.DecompressionStream === "function";
}

async function gzipBytes(data) {
  const cs = new CompressionStream("gzip");
  const stream = new Blob([data]).stream().pipeThrough(cs);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

async function gunzipBytes(data) {
  const ds = new DecompressionStream("gzip");
  const stream = new Blob([data]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

// 压缩：返回 {flags, data}。
// forceRaw=true 时跳过 gzip（用于调试/兼容）。
async function compress(data, { forceRaw = false } = {}) {
  if (!forceRaw && supportsCompressionStream()) {
    try {
      const gz = await gzipBytes(data);
      // 加 gzip 头尾开销约18B，只有收益明显(>2%)才采用，避免压缩噪声
      if (gz.length > 0 && gz.length < data.length * 0.98) {
        return { flags: FLAG_COMPRESS_GZIP, data: gz };
      }
    } catch {
      // 压缩异常则降级 raw
    }
  }
  return { flags: FLAG_COMPRESS_RAW, data: new Uint8Array(data) };
}

// 解压：按 flags 选择；raw 原样返回（拷贝语义由调用方保证）。
async function decompress(data, flags) {
  if ((flags & FLAG_COMPRESS_GZIP) === FLAG_COMPRESS_GZIP) {
    if (!supportsCompressionStream()) {
      throw new Error("当前浏览器不支持 gzip 解压（需 Safari 16.4+/Chrome 80+）");
    }
    return gunzipBytes(data);
  }
  return new Uint8Array(data);
}

/* ===== packet.js ===== */
// packet.js — 文件 ↔ 帧序列 的高层打包/解包（M1）
// 串起 compressor + protocol，对 sender/receiver/UI 暴露简单接口。
//
// M1：顺序定长分片（无 LT）。M2 接入喷泉码时只替换内部分片策略，
// 帧头与 meta 不变。



async function sha256(bytes) {
  if (globalThis.crypto?.subtle) {
    const digest = await crypto.subtle.digest("SHA-256", bytes);
    return new Uint8Array(digest);
  }
  // Node 单测兜底
  const { createHash } = await import("node:crypto");
  return new Uint8Array(createHash("sha256").update(bytes).digest());
}

// 把文件打包成 {metaFrame, dataFrames, meta}。
// 入参：{name, data(Uint8Array), taskId?, blockSize?, forceRaw?}
// 不显式给 blockSize 时，按目标 QR 档位（默认让单码尽量大但留摄像头余量）选。
async function packFile({
  name, data, taskId = null,
  blockSize = null, ecLevel = "L",
  forceRaw = false,
}) {
  const raw = data instanceof Uint8Array ? data : new Uint8Array(data);
  const { flags, data: payloadData } = await compress(raw, { forceRaw });

  // M1 选保守档位：默认 V25-L 单码 payload（摄像头好扫），不直接顶 V40。
  // 块大小不超该档位 payload 上限。
  let bs = blockSize;
  if (!bs) {
    const prof = chooseQrProfileForScan(25, ecLevel);
    bs = prof.blockSize;
  }
  const K = Math.max(1, Math.ceil(payloadData.length / bs));
  const tId = taskId == null ? Math.floor(Math.random() * 0xffff) : taskId & 0xffff;
  const digest = await sha256(raw);

  const meta = {
    taskId: tId, flags, K, blockSize: bs,
    fileLen: raw.length, sha256: digest, name: name || "file.bin",
  };
  const metaFrame = buildMetaFrame(meta);
  const dataFrames = buildDataFrames(meta, payloadData);
  return { meta, metaFrame, dataFrames };
}

// 接收端：喂 metaFrame（可重复，锁定首个任务）→ 返回 meta。
function unpackMeta(frame) {
  const m = parseMetaFrame(frame);
  return m; // null = 还不是有效 meta
}

// 接收端：解一个数据帧 → {frameSeq,payload,crcOk}
function unpackData(frame) {
  const d = parseDataFrame(frame);
  if (!d || !d.crcOk) return null;
  return { taskId: d.taskId, frameSeq: d.frameSeq, payload: d.payload, ver: d.ver };
}

// 用收齐的 K 个有序块重组并校验，返回原始文件 Uint8Array。
// blocks: 按 frameSeq 排好的 payload 数组（M1 等齐 K 个）。
async function assembleFile(meta, blocks) {
  if (blocks.length !== meta.K) {
    throw new Error(`块数不足：${blocks.length}/${meta.K}`);
  }
  const total = meta.blockSize * (meta.K - 1) +
    blocks[meta.K - 1].length;
  // 用各块实际长度拼，最后一块不补齐；总长按压缩数据 = Σ块长
  const compressed = concat(blocks);
  const raw = await decompress(compressed, meta.flags);
  if (raw.length !== meta.fileLen) {
    throw new Error(`解压后长度不符：${raw.length}/${meta.fileLen}`);
  }
  const digest = await sha256(raw);
  if (!bytesEqual(digest, meta.sha256)) {
    throw new Error("SHA-256 校验失败，文件损坏");
  }
  return raw;
}
function concat(arrs) {
  const n = arrs.reduce((s, a) => s + a.length, 0);
  const out = new Uint8Array(n);
  let o = 0;
  for (const a of arrs) { out.set(a, o); o += a.length; }
  return out;
}
function bytesEqual(a, b) {
  if (a.length !== b.length) return false;
  for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
  return true;
}

// M1 扫描档位（保守，优先识别率）。version 越大容量越大但越难扫。
function chooseQrProfileForScan(version = 25, ecLevel = "L") {
  return { version, ec: ecLevel, blockSize: qrPayloadCapacity(version, ecLevel) };
}

/* ===== wire-codec.js ===== */
// wire-codec.js — QR 物理层适配：把协议二进制帧 ↔ jsQR 能无损承载的文本
//
// 关键背景（2026-10-22 实测）：jsQR 内部按 UTF-8 解码，裸二进制帧(含 0x00/非UTF8)
// 会被丢弃返回空串；而 Base64 字符集(A-Za-z0-9+/=)走 QR Byte 模式可被 jsQR 无损还原。
// 故网页链路在 QR 边界统一做 Base64；P4 客户端(zbar 原始字节)可跳过本层（enc=raw）。
//
// 为让接收端能从一帧扫码文本里稳定切出 payload，每条扫码行用前缀/帧界定：
//   "ASQP1." + base64(payload) + ".E"
// 前缀含协议魔数与版本；base64 字符集不含 '.'，故 '.' 可作安全定界。


const PREFIX = "ASQP1."; // MAGIC ASCII("ASQP") + 协议版本1 + '.'
const SUFFIX = ".E";

function bytesToB64(u8) {
  if (typeof Buffer !== "undefined") return Buffer.from(u8).toString("base64");
  let bin = "";
  for (let i = 0; i < u8.length; i++) bin += String.fromCharCode(u8[i]);
  return btoa(bin);
}
function b64ToBytes(s) {
  if (typeof Buffer !== "undefined") return new Uint8Array(Buffer.from(s, "base64"));
  const bin = atob(s);
  const u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u;
}

// 二进制帧 → 送进 QR 的文本
function encodeWire(frameBytes) {
  return PREFIX + bytesToB64(frameBytes) + SUFFIX;
}

// 扫码得到的文本 → 二进制帧；不是本协议帧返回 null。
// 容忍画面里读到的空白/前后噪声，只截取首个完整 PREFIX...SUFFIX。
function decodeWire(text) {
  if (!text || typeof text !== "string") return null;
  const s = text.replace(/\s+/g, "");
  const start = s.indexOf(PREFIX);
  if (start < 0) return null;
  const body = s.slice(start + PREFIX.length);
  const end = body.indexOf(".");
  if (end < 0) return null;
  const b64 = body.slice(0, end);
  if (!/^[A-Za-z0-9+/]*={0,2}$/.test(b64)) return null;
  try {
    const bytes = b64ToBytes(b64);
    // 二次确认魔数，防止误命中
    if (bytes.length < 4 ||
        bytes[0] !== MAGIC[0] || bytes[1] !== MAGIC[1] ||
        bytes[2] !== MAGIC[2] || bytes[3] !== MAGIC[3]) return null;
    return bytes;
  } catch {
    return null;
  }
}

// 估算给定原始字节帧编码成 wire 文本后的长度（选 QR 版本用）。
function wireTextLen(frameByteLen) {
  return PREFIX.length + SUFFIX.length + Math.ceil(frameByteLen / 3) * 4;
}

/* ===== sender page ===== */



const $ = (id) => document.getElementById(id);
let timer = null, packed = null, playlist = [], cursor = 0;

$("fps").addEventListener("input", e => $("fpsv").textContent = e.target.value);

function err(msg){ $("err").textContent = msg || ""; }

$("start").addEventListener("click", async () => {
  err("");
  const f = $("file").files[0];
  const txt = $("text").value;
  let data, name;
  if (f) {
    data = new Uint8Array(await f.arrayBuffer());
    name = f.name;
  } else if (txt) {
    data = new TextEncoder().encode(txt);
    name = "note_" + Date.now().toString().slice(-5) + ".txt";
  } else { return err("请选择文件或输入文本"); }

  const version = parseInt($("density").value, 10);
  // 单帧原始帧字节上限 = QR byte容量；wire(base64)后文本要能放进同版本 QR，
  // 这里把块大小按 base64 膨胀(4/3)反推，确保最终编码不超容量。
  const byteCap = qrPayloadCapacity(version, "L");
  const blockSize = Math.floor((byteCap - 20) * 3 / 4); // 留帧头余量，再反base64膨胀
  try {
    packed = await packFile({ name, data, blockSize, taskId: Math.floor(Math.random()*0xffff) });
  } catch (e) { return err("打包失败：" + e.message); }

  // 播放序列：META 周期性插播 + 数据帧循环（M1 顺序轮播，靠重扫容错）
  const metaWire = encodeWire(packed.metaFrame);
  const dataWires = packed.dataFrames.map(fr => encodeWire(fr));
  playlist = [{ text: metaWire, type: "META", seq: -1 },
              ...dataWires.map((t, i) => ({ text: t, type: "DATA", seq: i }))];

  $("setup").style.display = "none";
  $("stage").style.display = "block";
  $("mTask").textContent = `${name} · ${(data.length/1024).toFixed(1)}KB · K=${packed.meta.K} · V${version}`;
  cursor = 0;
  const fps = parseInt($("fps").value, 10);
  drawFrame();
  timer = setInterval(drawFrame, 1000 / fps);
});

function drawFrame() {
  const item = playlist[cursor];
  // qrcode-generator：自动选版本可能与密度选择不符；这里用指定 version 锁定
  const version = parseInt($("density").value, 10);
  const qr = qrcode(version, "L");
  qr.addData(item.text, "Byte");
  qr.make();
  paint(qr);
  $("mType").textContent = item.type;
  $("mSeq").textContent = item.type === "DATA" ? `${item.seq + 1}/${packed.meta.K}` : "—";
  cursor = (cursor + 1) % playlist.length;
  if (item.type === "DATA") updateStats(item.seq);
}

function paint(qr) {
  const cv = $("player"), ctx = cv.getContext("2d");
  const n = qr.getModuleCount(), margin = 3, cell = Math.floor(cv.width / (n + margin * 2));
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = "#000";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++)
    if (qr.isDark(r, c)) ctx.fillRect((c + margin) * cell, (r + margin) * cell, cell, cell);
}

let shown = new Set();
function updateStats(seq) { shown.add(seq);
  $("stats").innerHTML = `文件 <b>${packed.meta.name}</b>　总块 <b>${packed.meta.K}</b><br>本轮已显示 <b>${shown.size}</b> 个不同块　压缩 <b>${packed.meta.flags & 1 ? "gzip" : "raw"}</b><br>提示：序列循环播放，接收端集齐全部块即完成（M2 喷泉码后无需按序）`;
}

$("stop").addEventListener("click", () => {
  clearInterval(timer); timer = null;
  $("stage").style.display = "none";
  $("setup").style.display = "block";
  shown = new Set();
});

</script>
</body>
