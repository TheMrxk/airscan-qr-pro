<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AirScan-QR Pro · 接收</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f172a">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AirScan">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<style>
  :root { --bg:#0f172a; --card:#1e293b; --accent:#7c3aed; --ok:#22c55e; --mut:#94a3b8; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:#e2e8f0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  .wrap { max-width:760px; margin:0 auto; padding:16px; }
  h1 { font-size:18px; margin:8px 0 4px; }
  .sub { color:var(--mut); font-size:12px; margin-bottom:14px; }
  .card { background:var(--card); border-radius:14px; padding:16px; margin-bottom:14px; }
  video { width:100%; border-radius:12px; background:#000; display:none; }
  canvas.hidden { display:none; }
  /* 取景器：视频容器内叠一个方形瞄准框，引导把二维码放进框里 */
  .view { position:relative; width:100%; display:none; }
  .view video { display:block; width:100%; }
  .reticle {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:78%; aspect-ratio:1/1; pointer-events:none;
    border:2px solid rgba(124,58,237,.9); border-radius:16px;
    box-shadow:0 0 0 9999px rgba(0,0,0,.28);
  }
  .reticle::before { content:""; position:absolute; inset:-2px; border-radius:16px;
    border:3px dashed rgba(255,255,255,.55); animation:none; }
  .reticle.good { border-color:#22c55e; }
  /* 矩阵引导网格线（JS 按阶数 data-n 画出）*/
  .grid-lines { position:absolute; inset:0; pointer-events:none; }
  .grid-lines i { position:absolute; background:rgba(255,255,255,.35); display:none; }
  .reticle[data-n="2"] .g-v1{display:block;left:50%;top:0;width:1px;height:100%;}
  .reticle[data-n="2"] .g-h1{display:block;top:50%;left:0;height:1px;width:100%;}
  .reticle[data-n="3"] .g-v1{display:block;left:33.33%;top:0;width:1px;height:100%;}
  .reticle[data-n="3"] .g-v2{display:block;left:66.66%;top:0;width:1px;height:100%;}
  .reticle[data-n="3"] .g-h1{display:block;top:33.33%;left:0;height:1px;width:100%;}
  .reticle[data-n="3"] .g-h2{display:block;top:66.66%;left:0;height:1px;width:100%;}
  .hint { position:absolute; left:0; right:0; bottom:10px; text-align:center;
    color:#fff; font-size:12px; text-shadow:0 1px 3px rgba(0,0,0,.8); pointer-events:none; }
  button { font-size:14px; border-radius:10px; border:1px solid #334155; background:#0f172a; color:#e2e8f0; padding:12px 16px; cursor:pointer; width:100%; }
  button.primary { background:var(--accent); border-color:var(--accent); font-weight:700; }
  .bar { background:#0f172a; border-radius:999px; height:14px; overflow:hidden; margin:8px 0; }
  .bar > i { display:block; height:100%; background:linear-gradient(90deg,#7c3aed,#3b82f6); width:0%; transition:width .2s; }
  .stat { font-size:13px; color:var(--mut); line-height:1.9; }
  .stat b { color:#fbbf24; }
  .okbox { display:none; background:rgba(34,197,94,.12); border:1px solid var(--ok); border-radius:12px; padding:14px; }
  .okbox a { color:#4ade80; }
  .pill { display:inline-block; background:#0f172a; border:1px solid #334155; border-radius:999px; padding:2px 10px; font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📥 AirScan-QR Pro · 接收端</h1>
  <div class="sub">摄像头对准发送屏幕 · 自动收集帧 · SHA-256 校验 · M1 · <span data-app-version>v0.4.1</span></div>

  <div class="card">
    <button class="primary" id="startCam">🎥 开启摄像头开始接收</button>
    <div class="view" id="view">
      <video id="video" playsinline muted></video>
      <div class="reticle" id="reticle" data-n="1">
        <div class="grid-lines">
          <i class="g-v1"></i><i class="g-v2"></i>
          <i class="g-h1"></i><i class="g-h2"></i>
        </div>
      </div>
      <div class="hint" id="camHint">把二维码整个放进方框，保持稳定</div>
    </div>
    <canvas class="hidden" id="canvas"></canvas>
  </div>

  <div class="card">
    <div class="stat">
      状态：<b id="phase">等待信号…</b><br>
      任务：<span id="task">—</span>
    </div>
    <div class="bar"><i id="prog"></i></div>
    <div class="stat">
      已解出源块 <b id="got">0</b>/<span id="total">?</span>　已收有效包 <b id="uniq">0</b>
      CRC失败 <b id="bad">0</b>　
      扫描 <b id="fps">0</b> 帧/秒
    </div>
    <div class="stat" id="rateLine" style="margin-top:6px">
      速率 <b id="rate">—</b>　预计剩余 <b id="eta">—</b>
    </div>
  </div>

  <div class="card okbox" id="done">
    <div style="font-size:15px;font-weight:700;color:#4ade80">✅ 接收完成，校验通过</div>
    <div class="stat" id="doneInfo" style="margin:8px 0"></div>
    <a id="download" download="#" style="display:inline-block;background:var(--ok);color:#04220f;padding:10px 16px;border-radius:10px;text-decoration:none;font-weight:700">💾 保存文件</a>
  </div>
</div>

<script src="../vendor/jsQR.min.js"></script>
<script>
// 注册 Service Worker（PWA：可加主屏、离线可用）
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
<script type="module">
import { unpackMeta, unpackData, LTReceiver } from "../js/packet.js";
import { decodeWire } from "../js/wire-codec.js";
import { peekFrameType, decodeMatrixN, FRAME_TYPE_META, FRAME_TYPE_DATA } from "../js/protocol.js";
import { matrixCells } from "../js/matrix.js";

const $ = (id) => document.getElementById(id);
let stream = null, raf = null, meta = null, recv = null;
let badCrc = 0, scans = 0, lastFpsT = performance.now();
let uniquePackets = 0;
let matrixN = 1;          // 锁定 META 后得知的一屏码数（1/2/3）
let busy = false;         // 上一帧还没解码完就跳过，不堆积
let lockT = 0, lastDecoded = 0, lastRateT = 0; // 速率/ETA 统计

$("startCam").addEventListener("click", async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false,
    });
    const v = $("video");
    v.srcObject = stream;
    await v.play();
    $("startCam").style.display = "none";
    $("view").style.display = "block";
    loop();
  } catch (e) {
    $("phase").textContent = "无法打开摄像头：" + e.message + "（需 HTTPS 或 localhost）";
  }
});

// 主线程解码（Worker 不可用时回退）
function decodeSync(imageData, w, h) {
  try {
    const r = jsQR(imageData, w, h, { inversionAttempts: "dontInvert" });
    return r && r.data ? r.data : null;
  } catch { return null; }
}

// Worker 解码池：矩阵时多格并行，避免 jsQR 单线程阻塞 UI；失败回退主线程。
class DecoderPool {
  constructor(size) {
    this.workers = [];
    this.fallback = false;
    this.seq = 0;
    const n = Math.max(1, Math.min(size, (navigator.hardwareConcurrency || 4) - 1 || size));
    for (let i = 0; i < n; i++) {
      try {
        const wk = new Worker("js/decoder-worker.js");
        this.workers.push(wk);
      } catch { this.fallback = true; break; }
    }
    if (!this.workers.length) this.fallback = true;
  }
  get size() { return this.fallback ? 0 : this.workers.length; }
  // jobs: [{data,width,height}] → Promise<(text|null)[]>，保持顺序
  async decode(jobs) {
    if (this.fallback) return jobs.map((j) => decodeSync(j.data, j.width, j.height));
    // 简单轮转：每个 job 取一个 worker，并行 await
    return Promise.all(jobs.map((j, idx) => new Promise((resolve) => {
      const wk = this.workers[idx % this.workers.length];
      const id = ++this.seq;
      const done = (e) => { if (e.data.id === id) { wk.removeEventListener("message", done); resolve(e.data.text); } };
      wk.addEventListener("message", done);
      // transfer 走 buffer（本帧不再复用）
      wk.postMessage({ id, data: j.data, width: j.width, height: j.height }, [j.data.buffer]);
      setTimeout(() => { wk.removeEventListener("message", done); resolve(null); }, 1500); // 单格超时保护
    })));
  }
}
let pool = null;

// 在中心 ROI 内按 n×n 切格，逐格解码，返回本帧读到的所有文本（异步并行）
async function decodeFrame(v, ctx, n) {
  const w = v.videoWidth, h = v.videoHeight;
  // ROI 取短边的 0.92（矩阵尽量占满，格更大更清晰）；单码沿用 0.82
  const ratio = n >= 2 ? 0.92 : 0.82;
  const side = Math.round(Math.min(w, h) * ratio);
  const sx = Math.round((w - side) / 2);
  const sy = Math.round((h - side) / 2);
  ctx.canvas.width = side; ctx.canvas.height = side;
  ctx.drawImage(v, sx, sy, side, side, 0, 0, side, side);

  // 组装待解码区域
  const rects = n === 1
    ? [{ sx: 0, sy: 0, size: side }]
    : matrixCells(side / 2, side / 2, side, n, 0);
  const jobs = rects.map((c) => {
    const img = ctx.getImageData(c.sx, c.sy, c.size, c.size);
    return { data: img.data, width: c.size, height: c.size };
  });

  if (!pool || pool.size !== (n === 1 ? 1 : n * n)) pool = new DecoderPool(n === 1 ? 1 : n * n);
  const results = await pool.decode(jobs);
  return results.filter(Boolean);
}

async function loop() {
  const v = $("video"), cv = $("canvas"), ctx = cv.getContext("2d", { willReadFrequently: true });
  const w = v.videoWidth, h = v.videoHeight;
  if (w && h && !busy) {
    busy = true;
    // 未锁定时先按单码找 META；锁定后按 META 里的矩阵阶数切格
    const n = meta ? matrixN : 1;
    try {
      const texts = await decodeFrame(v, ctx, n);
      let any = false;
      for (const t of texts) { if (handleText(t)) any = true; }
      flashReticle(any);
      scans++;
      const now = performance.now();
      if (now - lastFpsT > 1000) { $("fps").textContent = scans; scans = 0; lastFpsT = now; }
    } catch (e) { /* 单帧异常忽略，继续下一帧 */ }
    busy = false;
  }
  raf = requestAnimationFrame(loop);
}

function flashReticle(good) {
  $("reticle").classList.toggle("good", good);
}

// 返回 true 表示本帧至少识别出一个有效包（用于绿框反馈）
function handleText(text) {
  const frame = decodeWire(text);
  if (!frame) return false;
  const type = peekFrameType(frame);

  if (!meta) {
    if (type !== FRAME_TYPE_META) {
      $("phase").textContent = "发现二维码，等待 META 帧…";
      return true;
    }
    const m = unpackMeta(frame);
    if (m && m.ver >= 2) { lockMeta(m); return true; }
    $("phase").textContent = "发现二维码，等待 META 帧…";
    return true;
  }

  if (type === FRAME_TYPE_META) return true;   // 重复 META
  if (type !== FRAME_TYPE_DATA) return false;

  const d = unpackData(frame);
  if (!d) { badCrc++; $("bad").textContent = badCrc; return false; }
  if (d.taskId !== meta.taskId) return false;
  if (recv.seenPacket(d.frameSeq)) return true; // 重复 LT 包，仍算识别成功
  recv.feed(d.frameSeq, d.payload, d.taskId);
  uniquePackets++;
  $("uniq").textContent = uniquePackets;
  refresh();
  if (recv.done) finish();
  return true;
}

function fmtSize(bytes) {
  if (bytes >= 1024 * 1024) return (bytes / 1024 / 1024).toFixed(2) + "MB";
  if (bytes >= 1024) return (bytes / 1024).toFixed(1) + "KB";
  return bytes + "B";
}

function lockMeta(m) {
  meta = m; recv = new LTReceiver(m); uniquePackets = 0; badCrc = 0;
  lockT = performance.now(); lastDecoded = 0; lastRateT = lockT;
  matrixN = decodeMatrixN(m.flags);
  $("reticle").setAttribute("data-n", String(matrixN));
  const ntxt = matrixN >= 2 ? ` ${matrixN}×${matrixN} 矩阵` : "";
  $("phase").textContent = `已锁定任务，LT 喷泉收集中…（漏扫无需重传）${ntxt}`;
  const safeName = m.name || "(未命名)";
  $("task").textContent = `${safeName} · ${fmtSize(m.fileLen)} · ${m.K} 源块${ntxt} · ${m.flags & 1 ? "gzip" : "raw"}`;
  $("total").textContent = m.K;
  $("camHint").textContent = matrixN >= 2
    ? `把${matrixN}×${matrixN}个码整个对准网格，手机与屏幕尽量平行，绿色即识别`
    : "保持对准，绿色方框表示已识别，收够自动完成";
  refresh();
}

function refresh() {
  if (!meta || !recv) return;
  $("got").textContent = recv.decodedBlocks;
  $("prog").style.width = (recv.progress * 100) + "%";
  updateRate();
}

// 速率与预计剩余：用“已解出的压缩字节 / 墙钟时间”，按近 1 秒增量平滑。
// LT 前期可能长时间 0 块后突然成批解出，故同时给整体平均速率兜底。
function updateRate() {
  const now = performance.now();
  const decodedBytes = recv.decodedBlocks * meta.blockSize;
  const elapsed = (now - lockT) / 1000;
  if (elapsed < 0.5) return;
  // 整体平均有效速率（按压缩载荷字节，真实文件速率解压后另计）
  const avgBps = decodedBytes / elapsed;
  $("rate").textContent = fmtRate(avgBps);
  // ETA：剩余源块 / 近 1 秒解块速率；无增量时退回平均
  const remainBlocks = meta.K - recv.decodedBlocks;
  let blocksPerSec;
  const dt = (now - lastRateT) / 1000;
  if (dt >= 1) {
    blocksPerSec = (recv.decodedBlocks - lastDecoded) / dt;
    lastDecoded = recv.decodedBlocks; lastRateT = now;
  }
  if (remainBlocks <= 0) { $("eta").textContent = "完成"; return; }
  const useRate = (blocksPerSec && blocksPerSec > 0.05) ? blocksPerSec : recv.decodedBlocks / elapsed;
  if (useRate > 0) {
    const eta = remainBlocks / useRate;
    $("eta").textContent = eta > 60 ? Math.ceil(eta / 60) + " 分钟" : Math.ceil(eta) + " 秒";
  } else {
    $("eta").textContent = "收集中…";
  }
}

function fmtRate(bps) {
  if (bps >= 1024 * 1024) return (bps / 1024 / 1024).toFixed(2) + " MB/s";
  if (bps >= 1024) return (bps / 1024).toFixed(1) + " KB/s";
  return Math.round(bps) + " B/s";
}

async function finish() {
  $("phase").textContent = "已收够，LT 解码 + 校验中…";
  try {
    const raw = await recv.assemble();
    const blob = new Blob([raw], { type: "application/octet-stream" });
    const url = URL.createObjectURL(blob);
    const a = $("download");
    a.href = url; a.download = meta.name;
    $("doneInfo").innerHTML = `文件 <b>${meta.name}</b> · ${fmtSize(raw.length)} · 用 ${uniquePackets} 个 LT 包解出 ${meta.K} 块 · SHA-256 校验通过`;
    $("done").style.display = "block";
    $("phase").textContent = "✅ 完成";
    $("camHint").textContent = "接收完成，可点保存文件";
    cancelAnimationFrame(raf);
  } catch (e) {
    $("phase").textContent = "重组失败：" + e.message + "（继续采集即可，喷泉码会补齐）";
    // 失败不复位解码器：继续收包后 BP 可能解出更多块
  }
}
</script>
</body>
</html>
