<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AirScan-QR Pro · 发送</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f172a">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AirScan发送">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<style>
  :root { --bg:#0f172a; --card:#1e293b; --accent:#3b82f6; --ok:#22c55e; --mut:#94a3b8; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:#e2e8f0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  .wrap { max-width:760px; margin:0 auto; padding:16px; }
  h1 { font-size:18px; margin:8px 0 4px; }
  .sub { color:var(--mut); font-size:12px; margin-bottom:14px; }
  .card { background:var(--card); border-radius:14px; padding:16px; margin-bottom:14px; }
  label.row { display:block; font-size:13px; color:var(--mut); margin:10px 0 4px; }
  input[type=file], select, input[type=range] { width:100%; }
  select, button { font-size:14px; border-radius:10px; border:1px solid #334155; background:#0f172a; color:#e2e8f0; padding:10px 12px; }
  button.primary { background:var(--accent); border-color:var(--accent); font-weight:700; cursor:pointer; width:100%; }
  button.ghost { background:transparent; cursor:pointer; }
  .line { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .stat { font-size:13px; color:var(--mut); line-height:1.9; }
  .stat b { color:#fbbf24; font-variant-numeric:tabular-nums; }
  #stage { display:none; text-align:center; }
  #player { background:#fff; border-radius:12px; max-width:100%; }
  .meta-overlay { font-size:12px; color:var(--mut); margin-top:8px; font-variant-numeric:tabular-nums; }
  .pill { display:inline-block; background:#0f172a; border:1px solid #334155; border-radius:999px; padding:2px 10px; font-size:12px; margin-right:6px; }
  .err { color:#f87171; font-size:13px; min-height:18px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📤 AirScan-QR Pro · 发送端</h1>
  <div class="sub">物理隔离单向传输 · 纯本地运行 · gzip压缩 · M1单码 · <span data-app-version>v0.4.3</span></div>

  <div class="card" id="setup">
    <label class="row">① 选择文件（或粘贴文本）</label>
    <input type="file" id="file">
    <label class="row">或直接输入文本（与文件二选一）</label>
    <textarea id="text" rows="3" style="width:100%;background:#0f172a;color:#e2e8f0;border:1px solid #334155;border-radius:10px;padding:10px" placeholder="粘贴要传输的文字…"></textarea>

    <label class="row">② 扫描密度（越低越好扫；先从 V15 试）</label>
    <select id="density">
      <option value="10">V10 · 约 241B/帧（最稳，慢）</option>
      <option value="15" selected>V15 · 约 483B/帧（推荐起步）</option>
      <option value="20">V20 · 约 809B/帧</option>
      <option value="25">V25 · 约 1213B/帧（要求屏幕清晰）</option>
    </select>

    <label class="row">②.5 同屏码数（矩阵，手机正对屏幕；越高速越要稳）</label>
    <select id="matrix">
      <option value="1" selected>1×1 单码（最稳，任意角度）</option>
      <option value="2">2×2 四码（约 3~4 倍速度，需正对）</option>
      <option value="3">3×3 九码（最快，需正对+大屏清晰）</option>
    </select>
    <div class="row" id="matrixHint" style="font-size:12px;color:#fbbf24;margin-top:4px"></div>

    <label class="row">③ 播放帧率（帧/秒，手机识别跟得上再调高）<span id="fpsv">8</span> fps</label>
    <input type="range" id="fps" min="2" max="20" value="8">

    <div class="err" id="err"></div>
    <div style="height:10px"></div>
    <button class="primary" id="start">🚀 开始播放二维码</button>
  </div>

  <div class="card" id="stage">
    <canvas id="player" width="480" height="480"></canvas>
    <div class="meta-overlay">
      <span class="pill" id="mType">META</span>
      <span id="mSeq">0/0</span> · <span id="mTask"></span>
    </div>
    <div class="stat" id="stats" style="text-align:left;margin-top:10px"></div>
    <div style="height:10px"></div>
    <button class="ghost" id="stop">■ 停止</button>
  </div>
</div>

<!-- 本地化库（无外链） -->
<script src="../vendor/qrcode.js"></script>
<script type="module">
import { packFile, makeLtFrame } from "../js/packet.js";
import { encodeWire } from "../js/wire-codec.js";
import { wirePayloadCapacityB45, alphaCapacity } from "../js/protocol.js";
import { WIRE_QR_MODE } from "../js/wire-codec.js";
import { paintMatrixFast } from "../js/matrix.js";

const $ = (id) => document.getElementById(id);
let timer = null, packed = null, seed = 1, frameCount = 0, matrixN = 1, qrVersion = 15;
const META_EVERY = 24;   // 每播放 N 个数据【tick】整屏插播一次 META（帮晚到的接收端锁定）

$("fps").addEventListener("input", e => $("fpsv").textContent = e.target.value);

// 矩阵×密度组合提示：格越多、密度越高，每格模块越小越难扫
function updateMatrixHint() {
  const n = parseInt($("matrix").value, 10);
  const v = parseInt($("density").value, 10);
  const el = $("matrixHint");
  if (n === 1) { el.textContent = ""; return; }
  if (n === 3 && v >= 20) el.textContent = "⚠ 3×3 + V" + v + " 每格很小，建议密度降到 V10/V15 并用大屏";
  else if (n === 2 && v >= 25) el.textContent = "⚠ 2×2 + V25 偏密，若难识别降到 V15/V20";
  else el.textContent = "提示：手机与屏幕尽量平行正对，距离让 4/9 个码都落在取景框内";
}
$("matrix").addEventListener("change", updateMatrixHint);
$("density").addEventListener("change", updateMatrixHint);

function err(msg){ $("err").textContent = msg || ""; }

$("start").addEventListener("click", async () => {
  err("");
  const f = $("file").files[0];
  const txt = $("text").value;
  let data, name;
  if (f) {
    data = new Uint8Array(await f.arrayBuffer());
    name = f.name;
  } else if (txt) {
    data = new TextEncoder().encode(txt);
    name = "note_" + Date.now().toString().slice(-5) + ".txt";
  } else { return err("请选择文件或输入文本"); }

  qrVersion = parseInt($("density").value, 10);
  matrixN = parseInt($("matrix").value, 10);
  // LT 等长块：用精确容量反推 blockSize（wire base64 膨胀已计入）
  const blockSize = wirePayloadCapacityB45(qrVersion);
  if (blockSize <= 0) return err("该密度容量异常，换低档位");
  try {
    packed = await packFile({ name, data, blockSize, taskId: Math.floor(Math.random()*0xffff), matrixN });
  } catch (e) { return err("打包失败：" + e.message); }

  // 越界硬校验：任意 LT 帧定长（payload=blockSize），抽一帧确认 wire 不超 QR 容量
  const probe = encodeWire(makeLtFrame(packed, 1));
  if (probe.length > alphaCapacity(qrVersion)) {
    return err(`编码越界：${probe.length} > V${qrVersion} 字母数字容量，请降密度`);
  }

  $("setup").style.display = "none";
  $("stage").style.display = "block";

  // canvas 内部分辨率自适应：矩阵时每格必须足够大手机才好解析。
  // 目标每格物理像素：矩阵 380px（对拍验证的可靠尺寸），单码取视口允许的较大值。
  const cv = $("player");
  const CELL_TARGET = 380;
  const vw = Math.max(320, window.innerWidth - 48);
  const vh = Math.max(320, window.innerHeight - 220);
  const viewMax = Math.min(vw, vh, 1400);          // 不超过视口，上限 1400
  const need = matrixN * CELL_TARGET;                // 矩阵需要的整图边长
  const size = Math.max(480, Math.min(need, viewMax));
  cv.width = size; cv.height = size;

  $("mTask").textContent = `${name} · ${(data.length/1024).toFixed(1)}KB · K=${packed.meta.K} · V${qrVersion} · ${matrixN}×${matrixN}矩阵 · LT喷泉`;
  seed = 1; frameCount = 0; sentPackets = 0;
  const fps = parseInt($("fps").value, 10);
  drawFrame();
  timer = setInterval(drawFrame, 1000 / fps);
  requestWakeLock();
});

// 屏幕常亮：播放期间阻止息屏（不支持就静默跳过，不影响功能）
let wakeLock = null;
async function requestWakeLock() {
  try {
    if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen");
  } catch { wakeLock = null; }
}
function releaseWakeLock() {
  if (wakeLock) { wakeLock.release().catch(()=>{}); wakeLock = null; }
}
// 从后台切回前台时自动重新申请（Wake Lock 在页面隐藏后会失效）
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && timer) requestWakeLock();
});

// 造一个已 addData+make 的 qrcode 实例
function makeQr(text) {
  const qr = qrcode(qrVersion, "L");
  qr.addData(text, WIRE_QR_MODE); // Base45 → QR Alphanumeric 模式（5.5bit/字符，省容量）
  qr.make();
  return qr;
}

function drawFrame() {
  const cv = $("player"), ctx = cv.getContext("2d");
  const n2 = matrixN * matrixN;
  // 整屏要么全 META、要么全 DATA（接收端按格切分时类型一致）
  const isMeta = frameCount % (META_EVERY + 1) === 0;

  if (isMeta) {
    const qrs = new Array(n2).fill(encodeWire(packed.metaFrame)).map(makeQr);
    paintMatrixFast(ctx, cv.width, matrixN, qrs);
    $("mType").textContent = "META";
    $("mSeq").textContent = "—";
  } else {
    const qrs = [];
    const firstSeed = seed;
    for (let k = 0; k < n2; k++) { qrs.push(makeQr(encodeWire(makeLtFrame(packed, seed)))); seed++; }
    paintMatrixFast(ctx, cv.width, matrixN, qrs);
    sentPackets += n2;
    $("mType").textContent = "DATA";
    $("mSeq").textContent = `LT#${firstSeed}~${seed - 1}`;
    updateStats();
  }
  frameCount++;
}

let sentPackets = 0;
function updateStats() {
  const need = `${Math.ceil(packed.meta.K*1.5)}~${Math.ceil(packed.meta.K*2)}`;
  $("stats").innerHTML = `文件 <b>${packed.meta.name}</b>　源块 K=<b>${packed.meta.K}</b><br>已播放 LT 包 <b>${sentPackets}</b>（${matrixN}×${matrixN} 矩阵，每屏 ${matrixN*matrixN} 包；收够约 ${need} 个自动完成）<br>压缩 <b>${packed.meta.flags & 1 ? "gzip" : "raw"}</b> · 漏扫无需重传`;
}

$("stop").addEventListener("click", () => {
  clearInterval(timer); timer = null;
  $("stage").style.display = "none";
  $("setup").style.display = "block";
  sentPackets = 0;
  releaseWakeLock();
});
</script>
</body>
</html>
