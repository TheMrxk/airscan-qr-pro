# AirScan-QR Pro —— 一条命令部署 PWA
#
# 与其他项目一致：容器内纯 HTTP:80，主机映射到高端口；Cloudflare 在边缘提供 HTTPS。
# CF 回源地址按端口配置（airscan.10v.cc → 主机IP:8443，回源协议 HTTP/Flexible）。
# 用户访问 https://airscan.10v.cc/receiver.html（CF 可信证书，无自签警告）。
services:
  airscan:
    build: .
    image: airscan-qr-pro:latest
    container_name: airscan-qr-pro
    ports:
      - "8443:80"
    restart: unless-stopped
